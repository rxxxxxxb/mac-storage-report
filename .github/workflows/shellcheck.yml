name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

# Pinned rather than apt-installed: distro shellcheck versions lag and differ,
# so an unpinned CI can flag things a contributor's local run never showed.
env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: Lint
        run: shellcheck storage-report.sh

      - name: Syntax check under bash
        run: bash -n storage-report.sh
